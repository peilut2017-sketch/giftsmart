<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Green rounded-square background -->
  <rect width="100" height="100" rx="22" fill="#22c55e"/>

  <!-- Rounded diamond / gift-tag shape -->
  <rect x="16" y="16" width="68" height="68" rx="12"
        transform="rotate(45 50 50)"
        stroke="white" stroke-width="6" fill="none"/>

  <!-- Two tag dots -->
  <circle cx="33" cy="33" r="4.5" fill="white"/>
  <circle cx="43" cy="33" r="4.5" fill="white"/>

  <!-- Checkmark -->
  <path d="M30 52 L43 65 L70 38"
        stroke="white" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Arrow pointing upper-right — purple -->
  <line x1="70" y1="26" x2="86" y2="12" stroke="#e9d5ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M78 10 L87 10 L87 19"
        stroke="#e9d5ff" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Z accent -->
  <path d="M62 66 C70 57 80 68 75 77 C71 83 63 81 61 88"
        stroke="rgba(255,255,255,0.7)" stroke-width="4.5"
        stroke-linecap="round" fill="none"/>
</svg>
