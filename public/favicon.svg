<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Green rounded-square background -->
  <rect width="100" height="100" rx="22" fill="#22c55e"/>

  <!-- Rounded diamond / gift-tag shape -->
  <rect x="16" y="16" width="68" height="68" rx="12"
        transform="rotate(45 50 50)"
        stroke="white" stroke-width="6.5" fill="none"/>

  <!-- Tag hole -->
  <circle cx="35" cy="35" r="5.5" fill="white"/>

  <!-- Checkmark -->
  <path d="M30 51 L43 64 L70 37"
        stroke="white" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Arrow pointing upper-right -->
  <line x1="68" y1="28" x2="82" y2="14" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <path d="M76 13 L83 13 L83 20"
        stroke="white" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Z accent -->
  <path d="M62 66 C70 57 80 68 75 77 C71 83 63 81 61 88"
        stroke="rgba(255,255,255,0.7)" stroke-width="4.5"
        stroke-linecap="round" fill="none"/>
</svg>
