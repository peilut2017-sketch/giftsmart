<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#22c55e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GiftSmart" />
    <meta name="description" content="ניהול שוברים וכרטיסי מתנה בצורה חכמה" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>GiftSmart</title>
    <script>
      // Reset any stuck zoom to 1.0 on every page load (iOS Safari PWA)
      ;(function() {
        var m = document.querySelector('meta[name="viewport"]')
        if (!m) return
        var orig = m.getAttribute('content')
        m.setAttribute('content', orig + ',maximum-scale=1.0')
        requestAnimationFrame(function() { m.setAttribute('content', orig) })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
