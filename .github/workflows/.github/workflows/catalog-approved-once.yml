name: Approved catalog additions once
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: approved-catalog-additions-once
  cancel-in-progress: false
jobs:
  once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qybjmdbegpaiqzssnosr
      INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
      ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy only the approved temporary function
        run: supabase functions deploy approved-catalog-once-20261011 --project-ref "$PROJECT_REF"
      - name: Dry run and apply approved fixed snapshots
        run: |
          set -e
          url="https://$PROJECT_REF.supabase.co/functions/v1/approved-catalog-once-20261011"
          curl -fSs --max-time 90 "$url" -H "Authorization: Bearer $ANON_KEY" -H "apikey: $ANON_KEY" -H "X-Ingest-Secret: $INGEST_SECRET" -H 'Content-Type: application/json' -d '{"confirm":"approved-additions-20261011","dry_run":true}' > dry.json
          cat dry.json
          jq -e '.dry_run == true' dry.json
          curl -fSs --max-time 180 "$url" -H "Authorization: Bearer $ANON_KEY" -H "apikey: $ANON_KEY" -H "X-Ingest-Secret: $INGEST_SECRET" -H 'Content-Type: application/json' -d '{"confirm":"approved-additions-20261011"}' > applied.json
          cat applied.json
          jq -e '.success == true and .originals_unchanged == true' applied.json
      - name: Delete only the temporary function
        if: always()
        run: supabase functions delete approved-catalog-once-20261011 --project-ref "$PROJECT_REF" --yes
